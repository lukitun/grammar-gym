<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Parrot — Learn English Words for Kids</title>
  <meta name="description" content="Free English words for kids. Tap, listen, play. Pip the parrot says every word out loud." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦜</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
  </div>

  <header class="top">
    <button class="brand" id="homeLink" aria-label="Word Parrot home">
      <span class="parrot" id="parrot">🦜</span>
      <span class="brand-name">Word&nbsp;Parrot</span>
    </button>
    <div class="star-bank" id="starBank" title="Your stars">⭐ <span id="starCount">0</span></div>
  </header>

  <main id="app">

    <!-- Home: theme islands -->
    <section id="homeView">
      <h1 class="hello">Hi! I'm Pip.<br />Tap a bubble and play!</h1>
      <h2 class="section-h">🍎 Words</h2>
      <div class="theme-grid" id="themeGrid"></div>
      <h2 class="section-h">🧙 Grammar Path</h2>
      <p class="section-sub">Start at 1 and climb!</p>
      <div class="theme-grid" id="grammarGrid"></div>
    </section>

    <!-- Theme: pick a game -->
    <section id="themeView" hidden>
      <button class="back" id="backHome">← Back</button>
      <div class="theme-head">
        <span class="theme-big" id="themeEmoji"></span>
        <div>
          <h2 id="themeTitle"></h2>
          <p class="theme-tip" id="themeTip"></p>
        </div>
      </div>
      <div class="game-list">
        <button class="game-btn" id="gLearn"><span class="g-ico">👀</span><span class="g-name">Learn</span><span class="g-star" id="sLearn">☆</span></button>
        <button class="game-btn" id="gFind"><span class="g-ico">👆</span><span class="g-name">Find it</span><span class="g-star" id="sFind">☆</span></button>
        <button class="game-btn" id="gSpell"><span class="g-ico">🔤</span><span class="g-name">Spell it</span><span class="g-star" id="sSpell">☆</span></button>
      </div>
    </section>

    <!-- Learn: talking flashcards -->
    <section id="learnView" hidden>
      <button class="back" id="backLearn">← Back</button>
      <div class="dots" id="learnDots"></div>
      <button class="flashcard" id="flashcard" aria-label="Tap to hear the word">
        <span class="fc-emoji" id="fcEmoji"></span>
        <span class="fc-word" id="fcWord"></span>
        <span class="fc-hint">🔊 tap me!</span>
      </button>
      <div class="row-actions">
        <button class="big-btn next" id="learnNext">Next ➜</button>
      </div>
    </section>

    <!-- Find it: hear word, tap picture -->
    <section id="findView" hidden>
      <button class="back" id="backFind">← Back</button>
      <div class="dots" id="findDots"></div>
      <div class="ask">
        <button class="big-btn speak" id="findSpeak">🔊</button>
        <p class="ask-word">Where is <strong id="findWord"></strong>?</p>
      </div>
      <div class="pick-grid" id="pickGrid"></div>
    </section>

    <!-- Spell it: letter tiles -->
    <section id="spellView" hidden>
      <button class="back" id="backSpell">← Back</button>
      <div class="dots" id="spellDots"></div>
      <div class="spell-card">
        <button class="spell-pic" id="spellPic" aria-label="Tap to hear the word"></button>
        <div class="slots" id="slots"></div>
        <div class="tiles" id="tiles"></div>
        <button class="ghost-btn" id="spellReset">↺ start over</button>
      </div>
    </section>

    <!-- Lesson: grammar rule slides -->
    <section id="lessonView" hidden>
      <button class="back" id="backLesson">← Back</button>
      <div class="dots" id="lessonDots"></div>
      <button class="flashcard" id="lessonCard" aria-label="Tap to hear the sentence">
        <span class="fc-emoji" id="lsEmoji"></span>
        <span class="ls-text" id="lsText"></span>
        <span class="ls-note" id="lsNote"></span>
      </button>
      <div class="row-actions">
        <button class="big-btn next" id="lessonNext">Next ➜</button>
      </div>
    </section>

    <!-- Pick it: gap-fill quiz -->
    <section id="pickView" hidden>
      <button class="back" id="backPick">← Back</button>
      <div class="dots" id="pickDots"></div>
      <div class="quiz-card">
        <span class="q-emoji" id="qEmoji"></span>
        <p class="q-text" id="qText"></p>
        <span class="ls-note" id="qNote" hidden></span>
      </div>
      <div class="opt-list" id="optList"></div>
    </section>

    <!-- Build it: sentence from word tiles -->
    <section id="buildView" hidden>
      <button class="back" id="backBuild">← Back</button>
      <div class="dots" id="buildDots"></div>
      <div class="spell-card">
        <button class="spell-pic" id="buildPic" aria-label="Tap to hear the sentence"></button>
        <div class="slots" id="buildSlots"></div>
        <div class="tiles" id="buildTiles"></div>
        <button class="ghost-btn" id="buildReset">↺ start over</button>
      </div>
    </section>

    <!-- Cheer: game finished -->
    <section id="cheerView" hidden>
      <div class="cheer-card">
        <span class="cheer-parrot">🦜</span>
        <h2 id="cheerTitle">You did it!</h2>
        <p class="cheer-stars" id="cheerStars"></p>
        <div class="row-actions">
          <button class="big-btn next" id="cheerNext">Play more ➜</button>
        </div>
      </div>
    </section>

  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <footer class="foot">
    <span>Free for every kid. No signup, no ads.</span>
    <a href="../">Grown-up grammar practice →</a>
  </footer>

  <script src="words.js"></script>
  <script src="grammar.js"></script>
  <script src="app.js"></script>
</body>
</html>
